services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--selfScrapeInterval=10s"
      - "--vmui.customDashboardsPath=/etc/vm-dashboards"
    ports:
      - "8428:8428"
    volumes:
      - victoria_metrics_data:/storage
      - ./dashboards:/etc/vm-dashboards:ro
    networks:
      - observability
    restart: unless-stopped

  victoria-logs:
    image: victoriametrics/victoria-logs:latest
    container_name: victoria-logs
    command:
      - "-storageDataPath=/storage"
    ports:
      - "9428:9428"
    volumes:
      - victoria_logs_data:/storage
    networks:
      - observability
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.3
    container_name: alloy
    hostname: alloy
    privileged: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config/alloy.config:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /run:/run:ro
      - /var/run:/var/run:rw
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/udev/data:/run/udev/data:ro
    depends_on:
      - victoria-metrics
      - victoria-logs
    networks:
      - observability
    restart: unless-stopped

volumes:
  victoria_metrics_data:
    driver: local
  victoria_logs_data:
    driver: local
  alloy_data:
    driver: local

networks:
  observability:
    external: false
